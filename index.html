<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="Frontend/HomePage/HomePage.css">
</head>
<body>

    <h1 class="main-title">Contact Manager</h1>

    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="openTab(event, 'login')">Login</button>
            <button class="tab-btn" onclick="openTab(event, 'register')">Sign Up</button>
        </div>

        <div id="register" class="tab-content">
            <h2>Register</h2>
            <form>
                <input type="text" id="reg-firstName" placeholder="First Name">
                <input type="text" id="reg-lastName" placeholder="Last Name">
                <input type="email" id="reg-email" placeholder="Email">
                <input type="password" id="reg-password" placeholder="Password">
                
                <span id="signupResult" class="result-text"></span>
                
                <button type="submit" id="signup-submit" class="btn-submit">Sign Up</button>
            </form>
        </div>

        <div id="login" class="tab-content active">
            <h2>Login</h2>
            <form>
                <input type="email" id="login-email" placeholder="Email"> 
                <input type="password" id="login-password" placeholder="Password">
                
                <span id="loginResult" class="result-text"></span>

                <button type="submit" id="login-submit" class="btn-submit">Sign In</button>
            </form>
        </div>
    </div>

    <script src="Frontend/HomePage/HomePage.js"></script>

</body>
</html>
