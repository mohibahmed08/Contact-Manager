<!DOCTYPE html>
<head>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background-color: #fff;

            /* Notebook Paper */
            background-image:
                linear-gradient(to right, transparent 60px, #ff9ea5 60px, #ff9ea5 62px, transparent 62px),
                repeating-linear-gradient(transparent, transparent 29px, #00a6ff 30px);

            background-repeat: no-repeat, repeat;
            background-attachment: fixed;
        }

        #mainFrame {
            width: 100%;
            height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <iframe id="mainFrame" src="/Frontend/HomePage/HomePage.html"></iframe>

    <script>
        // Any page inside the iframe calls: window.parent.navigateTo('/path/to/page.html')
        function navigateTo(page) {
            document.getElementById('mainFrame').src = page;
        }
    </script>
</body>
