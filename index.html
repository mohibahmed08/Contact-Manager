<!DOCTYPE html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            
            display: flex;
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            
            background-color: #fff;
            
            /* Notebook Paper */
            background-image: 

                /* The Red Vertical Margin Line */
                linear-gradient(to right, transparent 60px, #ff9ea5 60px, #ff9ea5 62px, transparent 62px),
                
                /* The Blue Horizontal Lines */
                repeating-linear-gradient(transparent, transparent 29px, #00a6ff 30px);
                
            /* Positioning background elements */
            background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, repeat;
            background-attachment: fixed; /* Keeps lines fixed when scrolling */
        }
    </style>
</head>
