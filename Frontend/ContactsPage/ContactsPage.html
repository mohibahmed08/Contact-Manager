<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact List</title>
    <link rel="stylesheet" href="ContactsPage.css">
</head>
<body>

<div class="container">

    <div class="top-bar">
        
        <button class="add-btn" onclick="window.location.href='../EditContactPage/ContactEdit.html'">+ Add Contact</button>
        <div id="userName" class="user-greeting">Hello, John Doe</div>
    </div>

    <div class="header-controls">

    <h2>Contacts</h2>

    <div class="header-row">
        <div class="search-container">
            <input type="text" id="searchText" placeholder="Search..."
                onkeydown="if (event.key === 'Enter') searchContacts();"
                onblur="searchContacts();">
        </div>

        <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>

</div>
    <ul id="contactList">
        <li class="contact">

            <div class="contact-info">

                <div class="avatar">JD</div>

                <div class="contact-details">
                    <div class="name">
                        <span class="first-name"></span>
                        <span class="last-name"></span>
                    </div>

                    <a class="email" href="mailto:john.doe@example.com">
                        
                    </a>
                    <a class="phone" href="tel:1234567890">
                        
                    </a>

                </div>

            </div>

            <div class="contact-actions">
                <button class="edit-btn" id="editButton" onclick="editContact(this)">Edit</button>
                <button class="delete-btn" id="deleteButton" onclick="deleteContact(this)">🗑</button>
            </div>

        </li>
    </ul>
</div>


<div id="deleteModal" class="modal">
    <div class="modal-content">
        <p id="deleteText"></p>

        <div class="modal-actions">
            <button id="cancelDelete">Cancel</button>
            <button id="confirmDelete">Delete</button>
        </div>
    </div>
</div>

<script src="ContactsPage.js"></script>

</body>
</html>
