<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact List</title>
    <link rel="stylesheet" href="ContactsPage.css">
</head>
<body>

<div class="container">
    <h2>Contacts</h2>

    <ul id="contactList">
        <!-- Should be blank once fully implemented!!! This is populated from the database -->
        <li class="contact">

            <!-- Left side: avatar + contact details -->
            <div class="contact-info">

                <div class="avatar">JD</div>

                <div class="contact-details">
                    <div class="name">
                        <span class="first-name">John</span>
                        <span class="last-name">Doe</span>
                    </div>

                    <a class="email" href="mailto:john.doe@example.com">
                        john.doe@example.com
                    </a>
                    <a class="phone" href="tel:1234567890">
                        (123) 456-7890
                    </a>

                </div>

            </div>

            <!-- Right side: actions -->
            <div class="contact-actions">
                <button class="edit-btn" id = "editButton" onclick="editContact(this)">Edit</button>
                <button class="delete-btn" id = "deleteButton" onclick="deleteContact(this)">🗑</button>
            </div>

        </li>
    </ul>
</div>


<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
    <div class="modal-content">
        <p id="deleteText"></p>

        <div class="modal-actions">
            <button id="cancelDelete">Cancel</button>
            <button id="confirmDelete">Delete</button>
        </div>
    </div>
</div>

<script>
let contactToDelete = null;

function deleteContact(button) {
    contactToDelete = button.closest(".contact");

    const first = contactToDelete.querySelector(".first-name").textContent;
    const last = contactToDelete.querySelector(".last-name").textContent;

    document.getElementById("deleteText").textContent =
        `Delete contact "${first} ${last}"?`;

    document.getElementById("deleteModal").style.display = "flex";
}
document.getElementById("cancelDelete").onclick = function () {
    contactToDelete = null;
    document.getElementById("deleteModal").style.display = "none";
};

document.getElementById("confirmDelete").onclick = function () {
    if (contactToDelete) {
        contactToDelete.classList.add("removing");

        setTimeout(() => {
            contactToDelete.remove();
            contactToDelete = null;
        }, 250);
    }

    document.getElementById("deleteModal").style.display = "none";
};

// ADDED BY JASON TO LINK EDIT TO CONTACT PAGE FOR NOW
document.getElementById("editButton").onclick = () => {
    //OBTAIN THE CONTACT INFO ON CURRENT SELECTION (NEEDS THIS FORMAT FOR IT TO WORK)
    let contactInfo = ["John", "Doe", "(123) 456-7890", "john.doe@example.com"];
    //  ^^^^^^^^^^^ HARD CODED UNTIL YOU SET UP THE LIST TO DYNAMIC !!!!!!!
    //PASS IN THE CURRENT FIELD INFO ARRAY TO LOCAL STORAGE VIA JSON
    localStorage.setItem("contactInfo", JSON.stringify(contactInfo));    
    //SWITCH CONCURRENT WINDOW TO THE CONTACT EDIT PAGE
    window.location.href = '../EditContactPage/ContactEdit.html';
}

// added by Tyler to read user id from the cookie and redirect if not logged in
document.addEventListener("DOMContentLoaded", () => {
    const userId = readUserIdFromCookie();
    if (userId < 1) {
        window.location.href = "../HomePage/HomePage.html";
        return;
    }     
    retrieveContacts(userId);
});

</script>

<!-- ADDED BY JONATHAN, YOU CAN REVISE AND DELETE OR MODIFY AS DESIRED -->
 <script>
    function getInitials(firstName, lastName) {
        return '' + firstName[0] + lastName[0];
    }

    function formatPhone(phone) {
        const digits = String(phone || "").replace(/\D/g, "");

        if (digits.length !== 10) {
            return '';
        }

        phone = digits;

        return '(' + phone[0] + phone[1] + phone[2] + ') ' + phone[3] + phone[4] + phone[5] + "-" + phone[6] + phone[7] + phone[8] + phone[9];
    }

    function buildContact(contactId, firstName, lastName, email, phone) {
        return `<li class="contact" data-contact-id="${contactId}">
            <!-- Left side: avatar + contact details -->
            <div class="contact-info">
                <div class="avatar">${getInitials(firstName, lastName)}</div>
                <div class="contact-details">
                    <div class="name">
                        <span class="first-name">${firstName}</span>
                        <span class="last-name">${lastName}</span>
                    </div>

                    <a class="email" href="mailto:${email}">
                        ${email}
                    </a>
                    <a class="phone" href="tel:${phone}">
                        ${formatPhone(phone)}
                    </a>

                </div>

            </div>

            <!-- Right side: actions -->
            <div class="contact-actions">
                <button class="edit-btn" onclick="editContact(this)">Edit</button>
                <button class="delete-btn" onclick="deleteContact(this)">🗑</button>
            </div>

        </li>`
    }

    async function retrieveContacts(userId, query = "") {
        const params = new URLSearchParams({ UserID: String(userId)});
        if (query.trim() !== "") params.set("query", query.trim());

        const res = await fetch(`getContacts.php?${params.toString()}`);
        const data = await res.json();

        if (data.error) {
            console.error("getContacts error:", data.error);
            return;
        }

        const list = document.getElementById("contactList");
        list.innerHTML = "";

        for (const c of data.results) {
            list.innerHTML += buildContact(c.id, c.FirstName, c.LastName, c.Email, c.Phone);
        }

    }
    function readUserIdFromCookie() {
        const parts = document.cookie.split(",");
        for (const p of parts) {
            const [k, v] = p.trim().split("=");
            if (k === "userId") return parseInt(v, 10);
        }
        return -1;
    }

    function searchContacts() {
        const userId = readUserIdFromCookie();
        const q = document.getElementById("searchText").value;
        retrieveContacts(userId, q);
    }

 </script>

</body>
</html>
